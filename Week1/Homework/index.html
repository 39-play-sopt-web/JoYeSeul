<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Joy's place" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/photo-dump.css" />
    <link rel="stylesheet" href="css/likes.css" />
    <link rel="stylesheet" href="css/interests.css" />
    <link rel="stylesheet" href="css/to-web.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <title>Joy</title>
  </head>
  <body>
    <header>
      <img src="images/joyrii.png" alt="Profile Avatar" class="avatar" />
      <h1>잇츠미 예슬</h1>
      <a
        href="https://github.com/joyrii"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="images/github_logo.png" alt="GitHub Profile 이동" />
      </a>
    </header>
    <div class="layout">
      <nav>
        <ul class="nav-list">
          <li><a href="#photo-dump">📸 Photo Dump</a></li>
          <li><a href="#likes">❤️ Likes</a></li>
          <li><a href="#interests">🌻 Interests</a></li>
          <li><a href="#to-you">🌰 To Web</a></li>
        </ul>
      </nav>
      <main>
        <!-- photo dump -->
        <section id="photo-dump">
          <h2 class="heading">📸 Photo Dump</h2>
          <div class="photo-grid">
            <div class="photo-grid-item">
              <img src="images/photo1.png" alt="Cat 1" />
            </div>
            <div class="photo-grid-item">
              <img src="images/photo2.png" alt="Cat 2" />
            </div>
            <div class="photo-grid-item">
              <img src="images/photo3.png" alt="Cat 3" />
            </div>
            <div class="photo-grid-item">
              <img src="images/photo4.png" alt="Cat 4" />
            </div>
            <div class="photo-grid-item">
              <img src="images/photo5.png" alt="Cat 5" />
            </div>
            <div class="photo-grid-item">
              <img src="images/photo6.png" alt="Cat 6" />
            </div>
          </div>
        </section>
        <!-- likes -->
        <section id="likes">
          <h2 class="heading">❤️ Likes</h2>
          <div class="likes-container">
            <ul class="likes-list">
              <li><img src="images/like1.png" alt="Dog 1" /></li>
              <li><img src="images/like2.png" alt="Dog 2" /></li>
              <li><img src="images/like3.png" alt="Dog 3" /></li>
              <li><img src="images/like4.png" alt="Dog 4" /></li>
              <li><img src="images/like5.png" alt="Dog 5" /></li>
              <li><img src="images/like6.png" alt="Dog 6" /></li>
              <li><img src="images/like7.png" alt="Dog 7" /></li>
              <li><img src="images/like8.png" alt="Dog 8" /></li>
              <li><img src="images/like9.png" alt="Dog 9" /></li>
              <li aria-hidden="true"><img src="images/like1.png" alt="" /></li>
              <li aria-hidden="true"><img src="images/like2.png" alt="" /></li>
              <li aria-hidden="true"><img src="images/like3.png" alt="" /></li>
              <li aria-hidden="true"><img src="images/like4.png" alt="" /></li>
              <li aria-hidden="true"><img src="images/like5.png" alt="" /></li>
              <li aria-hidden="true"><img src="images/like6.png" alt="" /></li>
              <li aria-hidden="true"><img src="images/like7.png" alt="" /></li>
              <li aria-hidden="true"><img src="images/like8.png" alt="" /></li>
              <li aria-hidden="true"><img src="images/like9.png" alt="" /></li>
            </ul>
          </div>
        </section>
        <!-- interests -->
        <section id="interests">
          <h2 class="heading">🌻 Interests</h2>
          <ul class="interests-list">
            <li class="interest-card">
              <img src="images/interest1.png" alt="강아지" />
              <h3></h3>🐶 강쥐</h3>
              <div class="card-buttons">
                <button type="button" class="like">좋아요</button>
                <button type="button" class="dislike">싫어요</button>
              </div>
            </li>
            <li class="interest-card">
              <img src="images/interest2.png" alt="탈색" />
              <h3>😈 탈색</h3>
              <div class="card-buttons">
                <button type="button" class="like">좋아요</button>
                <button type="button" class="dislike">싫어요</button>
              </div>
            </li>
            <li class="interest-card">
              <img src="images/interest3.png" alt="뜨개질" />
              <h3>🧶 뜨개</h3>
              <div class="card-buttons">
                <button type="button" class="like">좋아요</button>
                <button type="button" class="dislike">싫어요</button>
              </div>
            </li>
            <li class="interest-card">
              <img src="images/interest4.png" alt="카페" />
              <h3>☕ 카페</h3>
              <div class="card-buttons">
                <button type="button" class="like">좋아요</button>
                <button type="button" class="dislike">싫어요</button>
              </div>
            </li>
            <li class="interest-card">
              <img src="images/interest5.png" alt="여행" />
              <h3>✈️ 여행</h3>
              <div class="card-buttons">
                <button type="button" class="like">좋아요</button>
                <button type="button" class="dislike">싫어요</button>
              </div>
            </li>
            <li class="interest-card">
              <img src="images/interest6.png" alt="잠" />
              <h3>😴 꿀잠</h3>
              <div class="card-buttons">
                <button type="button" class="like">좋아요</button>
                <button type="button" class="dislike">싫어요</button>
              </div>
            </li>
            <li class="interest-card">
              <img src="images/interest7.png" alt="산책" />
              <h3>🌳 산책</h3>
              <div class="card-buttons">
                <button type="button" class="like">좋아요</button>
                <button type="button" class="dislike">싫어요</button>
              </div>
            </li>
          </ul>
        </section>
        <!-- to web -->
        <section id="to-you">
          <h2 class="heading">🌰 To. 웹토리</h2>
          <div class="letter">
            <p>날이 많이 추워졌어요 감기 조심하세용</p>
            <p>파이팅 파이팅 파이팅</p>
          </div>
        </section>
      </main>
    </div>
    <!-- footer -->
    <footer>
      <p>그럼 이만</p>
    </footer>
  </body>
</html>
